<body>



<header>

<h1>
🍸 RP MANAGER

<div class="sub">

Registro de Reservas

</div>

<div class="container">


<div class="card">



<h2>

Nueva Reserva

</h2>




<label>

Fecha

</label>


<input 
type="date"
id="fecha">





<label>

Cliente

</label>


<input
type="text"
id="nombre"
placeholder="Nombre del cliente">

Número de Personas

</label>


<input
type="number"
id="personas"
placeholder="Ejemplo: 4">





<label>

RP Responsable

</label>


<select id="rp">

<option value="">

Seleccione RP

</option>


</select>




<label>

Observaciones

</label>


<textarea
id="obs"
placeholder="Notas adicionales">

</textarea>





<button 
class="guardar"
onclick="guardarReserva()">

✓ Guardar Reserva

</button>




<button
class="regresar"
onclick="location.href='index.html'">

⬅ Regresar

</button>



<div 
class="mensaje"
id="mensaje">

Reserva guardada correctamente

</div>




</div>


</div>







<script>





// CARGAR RP DEL ADMINISTRADOR


function cargarRP(){


let selector =
document.getElementById("rp");



db.collection("rps").onSnapshot(function(snapshot){


selector.innerHTML =
'<option value="">Seleccione RP</option>';


snapshot.docs.forEach(doc=>{


let nombre = doc.data().nombre;


let opcion =
document.createElement("option");


opcion.value = nombre;

opcion.textContent = nombre;


selector.appendChild(opcion);


});


});


}




cargarRP();








// GUARDAR RESERVA



function guardarReserva(){



let fecha =
document.getElementById("fecha").value;


let nombre =
document.getElementById("nombre").value.trim();


let personas =
document.getElementById("personas").value;


let rp =
document.getElementById("rp").value;


let obs =
document.getElementById("obs").value;




if(
fecha=="" ||
nombre=="" ||
personas=="" ||
rp==""
){


alert("Complete los campos obligatorios");


return;


}




let reserva={


fecha:fecha,

nombre:nombre,

personas:personas,

rp:rp,

mesa:"",

coordinador:"",

mesero:"",

consumo:0,

obs:obs,

fechaRegistro:new Date().toLocaleString()


};




db.collection("reservas").add(reserva).then(function(){


document.getElementById("mensaje").style.display="block";



document.getElementById("nombre").value="";

document.getElementById("personas").value="";

document.getElementById("obs").value="";

document.getElementById("rp").selectedIndex=0;



setTimeout(()=>{

document.getElementById("mensaje").style.display="none";

},3000);


}).catch(function(error){

alert("Ocurrió un error al guardar la reserva. Verifica tu conexión a internet e intenta de nuevo.");

});


}



</script>
