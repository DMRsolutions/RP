<body>



<header>

<img src="logo.png" alt="DMR System Solutions">

<h1>
🍸 RP MANAGER
</h1>


<div class="sub">

Registro de Reservas

</div>


</header>





<div class="container">


<div class="card">



<h2>

Nueva Reserva

</h2>




<label>

Fecha

</label>


<input 
type="date"
id="fecha">





<label>

Cliente

</label>


<input
type="text"
id="nombre"
placeholder="Nombre del cliente">





<label>

Número de Personas

</label>


<input
type="number"
id="personas"
placeholder="Ejemplo: 4">





<label>

RP Responsable

</label>


<select id="rp">

<option value="">

Seleccione RP

</option>


</select>




<label>

Observaciones

</label>


<textarea
id="obs"
placeholder="Notas adicionales">

</textarea>




<label>

Ticket de Compra (respaldo)

</label>

<div class="ayuda">Foto o PDF del ticket de consumo</div>

<input
type="file"
id="ticketInput"
accept="image/*,application/pdf"
onchange="previsualizarTicket()">

<img id="previewTicket" class="preview-ticket">

<div class="barra-container" id="barraContainer">
<div class="barra-progreso" id="barraProgreso"></div>
</div>




<button 
class="guardar"
onclick="guardarReserva()">

✓ Guardar Reserva

</button>




<button
class="regresar"
onclick="location.href='index.html'">

⬅ Regresar

</button>



<div 
class="mensaje"
id="mensaje">

Reserva guardada correctamente

</div>




</div>


</div>







<script>





// CARGAR RP DEL ADMINISTRADOR


function cargarRP(){


let selector =
document.getElementById("rp");



db.collection("rps").onSnapshot(function(snapshot){


selector.innerHTML =
'<option value="">Seleccione RP</option>';


snapshot.docs.forEach(doc=>{


let nombre = doc.data().nombre;


let opcion =
document.createElement("option");


opcion.value = nombre;

opcion.textContent = nombre;


selector.appendChild(opcion);


});


});


}




cargarRP();




// PREVISUALIZAR TICKET

function previsualizarTicket(){

let archivo =
document.getElementById("ticketInput").files[0];

let preview =
document.getElementById("previewTicket");

if(archivo && archivo.type.startsWith("image/")){

preview.src = URL.createObjectURL(archivo);
preview.style.display = "block";

}else{

preview.style.display = "none";

}

}








// GUARDAR RESERVA



function guardarReserva(){



let fecha =
document.getElementById("fecha").value;


let nombre =
document.getElementById("nombre").value.trim();


let personas =
document.getElementById("personas").value;


let rp =
document.getElementById("rp").value;


let obs =
document.getElementById("obs").value;




if(
fecha=="" ||
nombre=="" ||
personas=="" ||
rp==""
){


alert("Complete los campos obligatorios");


return;


}




let archivoTicket =
document.getElementById("ticketInput").files[0];



let reserva={


fecha:fecha,

nombre:nombre,

personas:personas,

rp:rp,

mesa:"",

coordinador:"",

mesero:"",

consumo:0,

obs:obs,

ticketURL:"",

ticketNombre:"",

fechaRegistro:new Date().toLocaleString()


};



let botonGuardar = document.querySelector(".guardar");

botonGuardar.disabled = true;

botonGuardar.textContent = "Guardando...";



db.collection("reservas").add(reserva).then(function(docRef){


if(archivoTicket){


subirTicket(docRef.id, archivoTicket);


}else{


finalizarGuardado();


}


}).catch(function(error){

alert("Ocurrió un error al guardar la reserva. Verifica tu conexión a internet e intenta de nuevo.");

botonGuardar.disabled = false;

botonGuardar.textContent = "✓ Guardar Reserva";

});


}




// SUBIR TICKET A FIREBASE STORAGE


function subirTicket(idReserva, archivo){


let barraContainer =
document.getElementById("barraContainer");

let barra =
document.getElementById("barraProgreso");

barraContainer.style.display = "block";

barra.style.width = "0%";



let rutaRef =
storage.ref().child("tickets/" + idReserva + "/" + archivo.name);


let tarea = rutaRef.put(archivo);


tarea.on("state_changed",

function(snapshot){

let porcentaje =
(snapshot.bytesTransferred / snapshot.totalBytes) * 100;

barra.style.width = porcentaje + "%";

},

function(error){

alert("La reserva se guardó, pero el ticket no pudo subirse. Puedes intentar más tarde desde el dashboard.");

barraContainer.style.display = "none";

finalizarGuardado();

},

function(){

tarea.snapshot.ref.getDownloadURL().then(function(url){

db.collection("reservas").doc(idReserva).update({

ticketURL:url,

ticketNombre:archivo.name

}).then(function(){

barraContainer.style.display = "none";

finalizarGuardado();

});

});

}

);


}




// FINALIZAR Y LIMPIAR FORMULARIO


function finalizarGuardado(){


document.getElementById("mensaje").style.display="block";


document.getElementById("nombre").value="";

document.getElementById("personas").value="";

document.getElementById("obs").value="";

document.getElementById("rp").selectedIndex=0;

document.getElementById("ticketInput").value="";

document.getElementById("previewTicket").style.display="none";


let botonGuardar = document.querySelector(".guardar");

botonGuardar.disabled = false;

botonGuardar.textContent = "✓ Guardar Reserva";


setTimeout(()=>{

document.getElementById("mensaje").style.display="none";

},3000);


}



</script>
