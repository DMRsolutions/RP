<body>



<header>

<img src="logo.png" alt="DMR System Solutions">

<h1>
🍸 RP MANAGER
</h1>


<div class="sub">

Registro de Reservas

</div>


<div class="sub" id="saludoRP" style="margin-top:4px;"></div>


<button

onclick="cerrarSesionRP()"

style="width:auto;padding:8px 16px;margin-top:12px;background:rgba(255,255,255,.15);color:white;font-size:12px;border:1px solid rgba(255,255,255,.3);">

🚪 Cerrar Sesión

</button>


</header>





<div class="container">


<div class="card">



<h2>

Nueva Reserva

</h2>




<label>

Fecha

</label>

type="date"
id="fecha">





<label>

Cliente

</label>

type="text"
id="nombre"
placeholder="Nombre del cliente">

</label>

type="number"
id="personas"
placeholder="Ejemplo: 4">

onclick="guardarReserva()">

onclick="location.href='index.html'">

class="mensaje"
id="mensaje">

Reserva guardada correctamente

<!-- MODAL QR DE RESERVA -->

<div class="modal-qr" id="modalQR">

<div class="modal-qr-content">

<h2>✅ Reserva Confirmada</h2>

<div class="datos-reserva-qr" id="datosReservaQR"></div>

<img id="imgQR" style="width:220px;height:220px;margin:15px auto;display:block;border-radius:10px;" alt="Código QR de la reserva">

<p style="font-size:12px;color:#888;">
Muestra este código al llegar al club, o envíalo al cliente por WhatsApp.
</p>

📲 Enviar por WhatsApp
</button>

⬇️ Descargar QR
</button>

Cerrar
</button>

<script>





// RP DE LA SESION ACTUAL


let nombreRPSesion = sessionStorage.getItem("dmrRPNombre") || "";


function cargarRP(){


document.getElementById("rp").value = nombreRPSesion;

document.getElementById("saludoRP").innerText = "\uD83D\uDC64 " + nombreRPSesion;


}




function cerrarSesionRP(){


sessionStorage.removeItem("dmrRPNombre");

sessionStorage.removeItem("dmrRPId");

location.href = "rp-login.html";


}




cargarRP();




// GUARDAR RESERVA



function guardarReserva(){



let fecha =
document.getElementById("fecha").value;


let nombre =
document.getElementById("nombre").value.trim();


let personas =
document.getElementById("personas").value;


let rp =
document.getElementById("rp").value;


let obs =
document.getElementById("obs").value;




if(
fecha=="" ||
nombre=="" ||
personas=="" ||
rp==""
){


alert("Complete los campos obligatorios");


return;


}




let reserva={


fecha:fecha,

nombre:nombre,

personas:personas,

rp:rp,

mesa:"",

coordinador:"",

mesero:"",

consumo:0,

obs:obs,

estadoCheckin:"pendiente",

fechaRegistro:new Date().toLocaleString()


};



let botonGuardar = document.querySelector(".guardar");

botonGuardar.disabled = true;

botonGuardar.textContent = "Guardando...";



db.collection("reservas").add(reserva).then(function(docRef){


finalizarGuardado(docRef.id, reserva);


}).catch(function(error){

alert("Ocurrió un error al guardar la reserva. Verifica tu conexión a internet e intenta de nuevo.");

botonGuardar.disabled = false;

botonGuardar.textContent = "✓ Guardar Reserva";

});


}




// FINALIZAR Y LIMPIAR FORMULARIO


function finalizarGuardado(idReserva, reserva){


document.getElementById("mensaje").style.display="block";


document.getElementById("nombre").value="";

document.getElementById("personas").value="";

document.getElementById("obs").value="";


let botonGuardar = document.querySelector(".guardar");

botonGuardar.disabled = false;

botonGuardar.textContent = "✓ Guardar Reserva";


setTimeout(()=>{

document.getElementById("mensaje").style.display="none";

},3000);


if(idReserva && reserva){

mostrarQR(idReserva, reserva);

}


}




// ===============================
// QR DE LA RESERVA
// ===============================


let ultimoQR = { idReserva:null, reserva:null };


function mostrarQR(idReserva, reserva){


ultimoQR = { idReserva, reserva };


let contenidoQR = "DMR-RESERVA:" + idReserva;


let urlQR =
"https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" + encodeURIComponent(contenidoQR);


document.getElementById("imgQR").src = urlQR;


document.getElementById("datosReservaQR").innerHTML =

"<b>Cliente:</b> " + reserva.nombre + "<br>" +
"<b>Personas:</b> " + reserva.personas + "<br>" +
"<b>Fecha:</b> " + reserva.fecha + "<br>" +
"<b>RP:</b> " + reserva.rp;


document.getElementById("modalQR").style.display = "flex";


}




function cerrarModalQR(){

document.getElementById("modalQR").style.display = "none";

}




function descargarQR(){


let img = document.getElementById("imgQR");

let enlace = document.createElement("a");

enlace.download = "reserva_" + (ultimoQR.reserva ? ultimoQR.reserva.nombre.replace(/[^a-z0-9]/gi,"_") : "qr") + ".png";

enlace.href = img.src;

enlace.target = "_blank";

enlace.click();


}




function enviarQRWhatsapp(){


let r = ultimoQR.reserva;


let mensaje =

"🍸 Reserva confirmada\n" +

"Cliente: " + r.nombre + "\n" +

"Personas: " + r.personas + "\n" +

"Fecha: " + r.fecha + "\n\n" +

"Muestra el código QR adjunto al llegar.";


let img = document.getElementById("imgQR");


fetch(img.src).then(function(respuesta){

return respuesta.blob();

}).then(function(blob){


let archivo = new File([blob], "reserva_qr.png", { type:"image/png" });


if(navigator.canShare && navigator.canShare({ files:[archivo] })){


navigator.share({

files:[archivo],

title:"Reserva DMR",

text:mensaje

}).catch(function(e){});


}else{


descargarQR();

window.open("https://wa.me/?text=" + encodeURIComponent(mensaje + " (adjunta la imagen del QR que se acaba de descargar)"), "_blank");


}


}).catch(function(e){


descargarQR();

window.open("https://wa.me/?text=" + encodeURIComponent(mensaje + " (adjunta la imagen del QR que se acaba de descargar)"), "_blank");


});


}


</script>
