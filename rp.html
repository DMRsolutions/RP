<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RP Manager | Reservas</title>


<style>

*{
box-sizing:border-box;
font-family:'Segoe UI',Arial,sans-serif;
}


body{

margin:0;
background:#f4f4f4;

}



header{

background:#111;
color:white;
padding:20px;
text-align:center;

}



header h1{

margin:0;
font-size:25px;

}



.sub{

color:#b8860b;
font-size:14px;
margin-top:5px;

}





.container{

max-width:550px;
margin:25px auto;
padding:20px;

}




.card{

background:white;
padding:25px;
border-radius:20px;
box-shadow:0 5px 20px #0002;

}





h2{

color:#b8860b;
margin-top:0;

}




label{

display:block;
font-weight:bold;
margin-top:15px;

}




input,
select,
textarea{

width:100%;
padding:14px;
margin-top:8px;
border-radius:12px;
border:1px solid #ddd;
font-size:16px;

}



textarea{

height:90px;
resize:none;

}




button{

width:100%;
padding:16px;
border:none;
border-radius:12px;
font-size:17px;
font-weight:bold;
cursor:pointer;
margin-top:15px;

}




.guardar{

background:#b8860b;
color:white;

}



.regresar{

background:#222;
color:white;

}



.mensaje{

display:none;
background:#009688;
color:white;
padding:15px;
border-radius:10px;
margin-top:15px;
text-align:center;

}



</style>


</head>


<body>



<header>

<h1>
🍸 RP MANAGER
</h1>


<div class="sub">

Registro de Reservas

</div>


</header>





<div class="container">


<div class="card">



<h2>

Nueva Reserva

</h2>




<label>

Fecha

</label>


<input 
type="date"
id="fecha">





<label>

Cliente

</label>


<input
type="text"
id="nombre"
placeholder="Nombre del cliente">





<label>

Número de Personas

</label>


<input
type="number"
id="personas"
placeholder="Ejemplo: 4">





<label>

RP Responsable

</label>


<select id="rp">

<option value="">

Seleccione RP

</option>


</select>





<label>

Número de Mesa

</label>


<input
type="number"
id="mesa"
placeholder="Ejemplo: 12">



<label>

Coordinador

</label>


<input
type="text"
id="coordinador"
placeholder="Nombre del coordinador">



<label>

Mesero

</label>


<input
type="text"
id="mesero"
placeholder="Nombre del mesero">





<label>

Observaciones

</label>


<textarea
id="obs"
placeholder="Notas adicionales">

</textarea>





<button 
class="guardar"
onclick="guardarReserva()">

✓ Guardar Reserva

</button>




<button
class="regresar"
onclick="location.href='index.html'">

⬅ Regresar

</button>



<div 
class="mensaje"
id="mensaje">

Reserva guardada correctamente

</div>




</div>


</div>







<script>





// CARGAR RP DEL ADMINISTRADOR


function cargarRP(){


let listaRP =
JSON.parse(localStorage.getItem("rps")) || [];



let selector =
document.getElementById("rp");



listaRP.forEach(rp=>{


let nombre = rp.nombre || rp;

let opcion =
document.createElement("option");


opcion.value = nombre;

opcion.textContent = nombre;


selector.appendChild(opcion);



});



}




cargarRP();








// GUARDAR RESERVA



function guardarReserva(){



let fecha =
document.getElementById("fecha").value;


let nombre =
document.getElementById("nombre").value.trim();


let personas =
document.getElementById("personas").value;


let rp =
document.getElementById("rp").value;


let mesa =
document.getElementById("mesa").value;


let coordinador =
document.getElementById("coordinador").value.trim();


let mesero =
document.getElementById("mesero").value.trim();


let obs =
document.getElementById("obs").value;




if(
fecha=="" ||
nombre=="" ||
personas=="" ||
rp==""
){


alert("Complete los campos obligatorios");


return;


}




let reservas =
JSON.parse(localStorage.getItem("reservas")) || [];





let reserva={


fecha:fecha,

nombre:nombre,

personas:personas,

rp:rp,

mesa:mesa,

coordinador:coordinador,

mesero:mesero,

obs:obs,

fechaRegistro:new Date().toLocaleString()


};




reservas.push(reserva);



localStorage.setItem(
"reservas",
JSON.stringify(reservas)
);




document.getElementById("mensaje").style.display="block";




document.getElementById("nombre").value="";

document.getElementById("personas").value="";

document.getElementById("mesa").value="";

document.getElementById("coordinador").value="";

document.getElementById("mesero").value="";

document.getElementById("obs").value="";

document.getElementById("rp").selectedIndex=0;



setTimeout(()=>{


document.getElementById("mensaje").style.display="none";


},3000);




}



</script>


</body>

</html>
