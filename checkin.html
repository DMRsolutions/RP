<body>


<header>

<h1>🚪 RP MANAGER — Check-in</h1>

<div class="sub">Escanea el QR del cliente en la entrada</div>

</header>


<div class="container">


<div class="card" id="cardLector">

<h2>📷 Escanear Código QR</h2>

<div id="lector"></div>

<div class="mensaje-estado" id="mensajeEstado"></div>

</div>


<div class="card resultado" id="cardResultado">

<h2>Datos de la Reserva</h2>

<div class="dato"><b>Cliente:</b> <span id="rCliente"></span></div>
<div class="dato"><b>Personas:</b> <span id="rPersonas"></span></div>
<div class="dato"><b>Fecha:</b> <span id="rFecha"></span></div>
<div class="dato"><b>RP:</b> <span id="rRP"></span></div>


<div id="bloqueMesaAsignada" style="display:none;text-align:center;">

<p>Mesa asignada:</p>

<div class="badge-mesa" id="numeroMesaAsignada"></div>

</div>


<div id="bloqueSinMesa" style="display:none;">

<p>Esta reserva aún no tiene mesa asignada. Selecciona una mesa libre:</p>

<div class="grid-mesas" id="gridMesasDisponibles"></div>

</div>


<button class="btn-secundario" onclick="reiniciarLector()">

🔄 Escanear Otra Reserva

</button>

</div>


<button class="btn-secundario" onclick="location.href='index.html'">

⬅ Menú Principal

</button>


<div class="watermark">RP Manager — DMR System</div>


</div>


<script>


let reservaActual = null;

let idReservaActual = null;

let lector = null;




// Texto a mostrar para el número de una mesa: quita el prefijo "PREMIUM-"
// para que las mesas de "Frente al Escenario" se vean solo con su número.

function etiquetaMesa(numero){

return (typeof numero === "string") ? numero.replace(/^PREMIUM-/, "") : numero;

}




function iniciarLector(){


lector = new Html5Qrcode("lector");


lector.start(

{ facingMode:"environment" },

{ fps:10, qrbox:230 },

onEscaneoExitoso,

function(errorEscaneo){}

).catch(function(err){

document.getElementById("mensajeEstado").className = "mensaje-estado mensaje-error";

document.getElementById("mensajeEstado").style.display = "block";

document.getElementById("mensajeEstado").innerText =

"No se pudo activar la cámara. Da permiso de cámara al navegador e intenta de nuevo.";

});


}




function onEscaneoExitoso(textoDecodificado){


if(!textoDecodificado.startsWith("DMR-RESERVA:")){

return;

}


let idReserva = textoDecodificado.replace("DMR-RESERVA:","");


lector.pause(true);


buscarReserva(idReserva);


}




function buscarReserva(idReserva){


db.collection("reservas").doc(idReserva).get().then(function(doc){


if(!doc.exists){

mostrarMensajeEstado("Este código QR no corresponde a ninguna reserva.", true);

setTimeout(reanudarLector, 2000);

return;

}


reservaActual = doc.data();

idReservaActual = idReserva;


mostrarResultado();


}).catch(function(e){

mostrarMensajeEstado("Error al buscar la reserva. Verifica tu conexión.", true);

setTimeout(reanudarLector, 2000);

});


}




function mostrarMensajeEstado(texto, esError){


let el = document.getElementById("mensajeEstado");

el.className = "mensaje-estado " + (esError ? "mensaje-error" : "mensaje-ok");

el.style.display = "block";

el.innerText = texto;


setTimeout(()=>{ el.style.display="none"; }, 3000);


}




function mostrarResultado(){


document.getElementById("cardLector").style.display = "none";

document.getElementById("cardResultado").style.display = "block";


document.getElementById("rCliente").innerText = reservaActual.nombre;

document.getElementById("rPersonas").innerText = reservaActual.personas;

document.getElementById("rFecha").innerText = reservaActual.fecha;

document.getElementById("rRP").innerText = reservaActual.rp;


if(reservaActual.estadoCheckin == "llegó"){

mostrarMensajeEstado("Esta reserva ya había hecho check-in anteriormente.", false);

}


if(reservaActual.mesa && reservaActual.mesa!=""){


document.getElementById("bloqueMesaAsignada").style.display = "block";

document.getElementById("bloqueSinMesa").style.display = "none";

document.getElementById("numeroMesaAsignada").innerText = "Mesa " + etiquetaMesa(reservaActual.mesa);


if(reservaActual.estadoCheckin == "llegó"){

// Ya se había confirmado antes: solo se muestra la mesa y se regresa
// al lector sin volver a marcar nada.

setTimeout(reiniciarLector, 2500);

}else{

// Ya tiene mesa asignada: se confirma la llegada de inmediato, sin
// pedir que el RP presione un botón adicional.

confirmarLlegada();

}


}else{


document.getElementById("bloqueMesaAsignada").style.display = "none";

document.getElementById("bloqueSinMesa").style.display = "block";

cargarMesasDisponibles();


}


}




function cargarMesasDisponibles(){


let contenedor = document.getElementById("gridMesasDisponibles");

contenedor.innerHTML = "Cargando mesas...";


db.collection("mesas").orderBy("numero").get().then(function(snapshot){


if(snapshot.empty){

contenedor.innerHTML =
"<p style='grid-column:1/-1;color:#c0392b;'>No hay mesas configuradas. Pide al administrador que las genere desde el panel de administración.</p>";

return;

}


contenedor.innerHTML = "";


snapshot.docs.forEach(doc=>{


let mesa = doc.data();

let boton = document.createElement("button");


boton.className = "mesa-btn" + (mesa.estado=="ocupada" ? " ocupada" : "");

boton.innerText = etiquetaMesa(mesa.numero);

boton.disabled = (mesa.estado=="ocupada");


boton.onclick = function(){

asignarMesaYConfirmar(mesa.numero);

};


contenedor.appendChild(boton);


});


}).catch(function(e){

contenedor.innerHTML = "<p style='grid-column:1/-1;color:#c0392b;'>Error al cargar las mesas.</p>";

});


}




function asignarMesaYConfirmar(numeroMesa){


db.collection("reservas").doc(idReservaActual).update({

mesa:numeroMesa

}).then(function(){


reservaActual.mesa = numeroMesa;

marcarMesaOcupada(numeroMesa);


});


}




function confirmarLlegada(){


marcarMesaOcupada(reservaActual.mesa);


}




function marcarMesaOcupada(numeroMesa){


db.collection("mesas").doc(String(numeroMesa)).set({

numero:numeroMesa,

estado:"ocupada",

reservaId:idReservaActual,

cliente:reservaActual.nombre

},{merge:true}).then(function(){


db.collection("reservas").doc(idReservaActual).update({

estadoCheckin:"llegó",

horaLlegada:new Date().toLocaleString()

}).then(function(){


mostrarMensajeEstado("✅ Check-in confirmado. Mesa " + etiquetaMesa(numeroMesa) + " asignada a " + reservaActual.nombre + ".", false);


setTimeout(reiniciarLector, 2500);


});


});


}




function reanudarLector(){


if(lector){

lector.resume();

}


}




function reiniciarLector(){


document.getElementById("cardResultado").style.display = "none";

document.getElementById("cardLector").style.display = "block";


reservaActual = null;

idReservaActual = null;


reanudarLector();


}




iniciarLector();


</script>
