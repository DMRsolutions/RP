<style>

box-sizing:border-box;

body{

margin:0;
min-height:100vh;
display:flex;
justify-content:center;

padding:20px 0 70px 0;

background:
radial-gradient(circle at 20% 20%, #1a1a1a, #0a0a0a 60%);

max-width:420px;

background:white;

border-radius:26px;

padding:38px 26px;

button{

color:white;

.accesos{

flex-direction:column;
gap:12px;

}


.acceso-btn{

display:flex;
align-items:center;
gap:14px;

border-radius:16px;

margin-top:0;

}

transform:translateY(-2px);
box-shadow:0 8px 18px rgba(0,0,0,.15);

}


.acceso-icono{

font-size:24px;
width:44px;
height:44px;
min-width:44px;

justify-content:center;

}

}


.acceso-texto span{

display:block;
font-size:12px;
opacity:.85;
margin-top:2px;
font-weight:normal;

}


.dashboard{ background:linear-gradient(90deg,#b8860b,#d4af37); color:white; }

.admin{ background:#f4f4f4; color:#222; border:1px solid #e2e2e2; }

.admin .acceso-icono{ background:#eee; }

.checkin{ background:#1a3d1a; color:white; }

.checkin .acceso-icono{ background:rgba(255,255,255,.18); }


.bienvenida{

font-size:15px;
color:#444;

}


.watermark{

bottom:15px;

text-align:center;

font-size:13px;
opacity:.7;
letter-spacing:1px;

}


.link-cerrar{

background:none;
border:none;
color:#999;
font-size:13px;
text-decoration:underline;

font-size:14px;

}


</style>

<body>


<div class="container">


<div id="avisoInactividad" style="display:none;background:#fff3cd;color:#7a5b00;border:1px solid #ffe08a;padding:14px;border-radius:12px;margin-bottom:15px;font-weight:bold;text-align:center;">

⚠️ Sesión cerrada por inactividad y protección de información.

</div>


<div class="logo">

<img src="logo.png" alt="DMR System Solutions">

</div>


<h1>RP MANAGER</h1>

<div class="subtitulo">Sistema Profesional de Reservas · DMR System</div>



<!-- ================= LOGIN / REGISTRO ================= -->

<div id="vistaLogin">


<div class="tabs">

<button class="tab-btn activo" id="tabIngresar" onclick="cambiarTab('ingresar')">Ingresar</button>

<button class="tab-btn" id="tabRegistro" onclick="cambiarTab('registro')">Crear cuenta</button>

</div>



<!-- PANEL INGRESAR -->

<div class="panel activo" id="panelIngresar">


<label>Usuario</label>

<input type="text" id="usuario" placeholder="Tu usuario" autocapitalize="none">


<label>Contraseña</label>

<input type="password" id="password" placeholder="Tu contraseña">


<div class="error" id="mensajeError"></div>


<button class="entrar" onclick="entrar()">Ingresar</button>


</div>



<!-- PANEL REGISTRO -->

<div class="panel" id="panelRegistro">


<label>Nombre completo</label>

<input type="text" id="regNombre" placeholder="Tu nombre completo">


<label>Usuario (sin espacios)</label>

<input type="text" id="regUsuario" placeholder="Ejemplo: montse" autocapitalize="none">


<label>Contraseña</label>

<input type="password" id="regPassword" placeholder="Crea tu contraseña">


<label>Confirmar contraseña</label>

<input type="password" id="regPassword2" placeholder="Repite tu contraseña">


<label>¿Qué acceso necesitas?</label>

<select id="regRol">
<option value="rp">🍸 RP — Registrar reservas</option>
<option value="dueno">👑 Dueño — Ver reportes</option>
</select>


<div class="error" id="mensajeErrorRegistro"></div>

<div class="exito" id="mensajeExitoRegistro"></div>


<button class="entrar" onclick="registrar()">Crear cuenta</button>


</div>


</div>



<!-- ================= MENU POST-LOGIN ================= -->

<div id="vistaMenu" style="display:none;">


<div class="bienvenida" id="textoBienvenida"></div>


<div class="accesos" id="accesosMenu"></div>


<button class="link-cerrar" onclick="cerrarSesionIndex()">🚪 Cerrar sesión</button>


</div>



<!-- ================= CARGANDO ================= -->

<div id="vistaCargando" style="display:none;" class="cargando">Verificando acceso...</div>



</div>


<div class="watermark">© 2026 DMR System | Todos los derechos reservados</div>


<script>


// ===============================
// CONTRASEÑA DE ARRANQUE DEL ADMINISTRADOR
// ===============================
// Esta cuenta siempre funciona, incluso si aún no existe ningún usuario
// en Firestore. Úsala para entrar la primera vez y, desde el panel de
// Administración, crea las demás cuentas (RP, Dueño u otros Administradores).

const ADMIN_BOOTSTRAP_USUARIO = "admin";

const ADMIN_BOOTSTRAP_PASSWORD = "1234";




// ===============================
// CARGA INICIAL
// ===============================


window.onload = function(){


let parametros = new URLSearchParams(window.location.search);


if(parametros.get("motivo") === "inactividad"){

sessionStorage.removeItem("dmrRol");

sessionStorage.removeItem("dmrRPId");

sessionStorage.removeItem("dmrRPNombre");

sessionStorage.removeItem("dmrPermisosDueno");


document.getElementById("avisoInactividad").style.display = "block";

window.history.replaceState({}, document.title, window.location.pathname);

}


evaluarSesion();


};




function evaluarSesion(){


// Si ya hay una sesión de RP activa, va directo a reservación.

if(sessionStorage.getItem("dmrRPId")){

location.href = "rp.html";

return;

}


let rol = sessionStorage.getItem("dmrRol");


if(rol === "admin"){

mostrarMenuAdmin();

return;

}


if(rol === "dueno"){

mostrarMenuDueno();

return;

}


mostrarVistaLogin();


}




function mostrarVistaLogin(){

document.getElementById("vistaLogin").style.display = "block";

document.getElementById("vistaMenu").style.display = "none";

document.getElementById("vistaCargando").style.display = "none";

}




function mostrarVistaCargando(){

document.getElementById("vistaLogin").style.display = "none";

document.getElementById("vistaMenu").style.display = "none";

document.getElementById("vistaCargando").style.display = "block";

}




// ===============================
// PESTAÑAS INGRESAR / CREAR CUENTA
// ===============================


function cambiarTab(tab){

document.getElementById("tabIngresar").classList.toggle("activo", tab=="ingresar");

document.getElementById("tabRegistro").classList.toggle("activo", tab=="registro");

document.getElementById("panelIngresar").classList.toggle("activo", tab=="ingresar");

document.getElementById("panelRegistro").classList.toggle("activo", tab=="registro");

}




// ===============================
// INGRESAR
// ===============================


function entrar(){


let usuario =
document.getElementById("usuario").value.trim().toLowerCase();

let password =
document.getElementById("password").value;


let error = document.getElementById("mensajeError");

error.style.display = "none";


if(usuario=="" || password==""){

error.innerText = "Ingresa tu usuario y contraseña";

error.style.display = "block";

return;

}


// Cuenta de arranque del Administrador (siempre disponible).

if(usuario === ADMIN_BOOTSTRAP_USUARIO && password === ADMIN_BOOTSTRAP_PASSWORD){

sessionStorage.setItem("dmrRol","admin");

sessionStorage.removeItem("dmrPermisosDueno");

mostrarMenuAdmin();

return;

}


let boton = document.querySelector("#panelIngresar .entrar");

boton.disabled = true;

boton.textContent = "Verificando...";


db.collection("usuarios")

.where("usuario","==",usuario)

.where("password","==",password)

.get()

.then(function(snapshot){


boton.disabled = false;

boton.textContent = "Ingresar";


if(snapshot.empty){

error.innerText = "Usuario o contraseña incorrectos";

error.style.display = "block";

return;

}


let doc = snapshot.docs[0];

let datos = doc.data();


if(datos.aprobado === false){

error.innerText = "Tu cuenta aún no ha sido aprobada por el administrador. Inténtalo más tarde.";

error.style.display = "block";

return;

}


if(datos.rol === "rp"){

sessionStorage.setItem("dmrRPNombre", datos.nombre);

sessionStorage.setItem("dmrRPId", doc.id);

location.href = "rp.html";

return;

}


if(datos.rol === "admin"){

sessionStorage.setItem("dmrRol","admin");

sessionStorage.removeItem("dmrPermisosDueno");

mostrarMenuAdmin();

return;

}


// Dueño

sessionStorage.setItem("dmrRol","dueno");

sessionStorage.removeItem("dmrPermisosDueno");

mostrarMenuDueno();


}).catch(function(e){


boton.disabled = false;

boton.textContent = "Ingresar";

error.innerText = "Error de conexión. Intenta de nuevo.";

error.style.display = "block";


});


}




// ===============================
// CREAR CUENTA
// ===============================


function registrar(){


let nombre =
document.getElementById("regNombre").value.trim();

let usuario =
document.getElementById("regUsuario").value.trim().toLowerCase().replace(/\s+/g,"");

let password =
document.getElementById("regPassword").value;

let password2 =
document.getElementById("regPassword2").value;

let rol =
document.getElementById("regRol").value;


let error = document.getElementById("mensajeErrorRegistro");

let exito = document.getElementById("mensajeExitoRegistro");

error.style.display = "none";

exito.style.display = "none";


if(nombre=="" || usuario=="" || password==""){

error.innerText = "Completa todos los campos";

error.style.display = "block";

return;

}


if(password.length < 4){

error.innerText = "La contraseña debe tener al menos 4 caracteres";

error.style.display = "block";

return;

}


if(password !== password2){

error.innerText = "Las contraseñas no coinciden";

error.style.display = "block";

return;

}


if(usuario === ADMIN_BOOTSTRAP_USUARIO){

error.innerText = "Ese usuario está reservado. Elige otro.";

error.style.display = "block";

return;

}


let boton = document.querySelector("#panelRegistro .entrar");

boton.disabled = true;

boton.textContent = "Creando cuenta...";


db.collection("usuarios").where("usuario","==",usuario).get().then(function(snapshot){


if(!snapshot.empty){

boton.disabled = false;

boton.textContent = "Crear cuenta";

error.innerText = "Ese usuario ya está en uso. Elige otro.";

error.style.display = "block";

return;

}


db.collection("usuarios").add({

nombre:nombre,

usuario:usuario,

password:password,

rol:rol,

aprobado:false,

fecha: new Date().toLocaleDateString()

}).then(function(){


boton.disabled = false;

boton.textContent = "Crear cuenta";


document.getElementById("regNombre").value = "";

document.getElementById("regUsuario").value = "";

document.getElementById("regPassword").value = "";

document.getElementById("regPassword2").value = "";


exito.innerText = "Cuenta creada. El administrador debe aprobarla antes de que puedas ingresar.";

exito.style.display = "block";


});


}).catch(function(e){


boton.disabled = false;

boton.textContent = "Crear cuenta";

error.innerText = "Error de conexión. Intenta de nuevo.";

error.style.display = "block";


});


}




// ===============================
// MENU POST-LOGIN — ADMINISTRADOR
// ===============================


function mostrarMenuAdmin(){


document.getElementById("textoBienvenida").innerText = "🛠️ Sesión de Administrador";


let html = "";


html += botonAcceso("dashboard", "📊", "Dashboard", "Métricas, mapa de mesas y reportes", "dashboard.html");

html += botonAcceso("admin", "⚙️", "Administración", "Usuarios, mesas, coordinadores y tarifas", "admin.html");

html += botonAcceso("checkin", "📷", "Check-in", "Escanear código QR de reservas", "checkin.html");


document.getElementById("accesosMenu").innerHTML = html;


document.getElementById("vistaLogin").style.display = "none";

document.getElementById("vistaCargando").style.display = "none";

document.getElementById("vistaMenu").style.display = "block";


}




// ===============================
// MENU POST-LOGIN — DUEÑO
// ===============================


function mostrarMenuDueno(){


document.getElementById("textoBienvenida").innerText = "👑 Sesión de Dueño";


let permisosGuardados = sessionStorage.getItem("dmrPermisosDueno");


if(permisosGuardados){

renderizarMenuDueno(JSON.parse(permisosGuardados));

return;

}


mostrarVistaCargando();


db.collection("config").doc("permisosDueno").get().then(function(doc){

let datos = doc.exists ? doc.data() : {};

sessionStorage.setItem("dmrPermisosDueno", JSON.stringify(datos));

renderizarMenuDueno(datos);

}).catch(function(){

renderizarMenuDueno({});

});


}




function renderizarMenuDueno(datos){


let paginas = [];


// Por defecto Dashboard y Check-in están habilitados salvo que el
// administrador los haya desactivado. Administración solo se habilita
// si el administrador la activó explícitamente.

if(datos.verDashboard !== false){

paginas.push({ id:"dashboard", icono:"📊", titulo:"Dashboard", texto:"Métricas, mapa de mesas y reportes", href:"dashboard.html" });

}

if(datos.verAdmin === true){

paginas.push({ id:"admin", icono:"⚙️", titulo:"Administración", texto:"Usuarios, mesas, coordinadores y tarifas", href:"admin.html" });

}

if(datos.verCheckin !== false){

paginas.push({ id:"checkin", icono:"📷", titulo:"Check-in", texto:"Escanear código QR de reservas", href:"checkin.html" });

}


document.getElementById("vistaLogin").style.display = "none";

document.getElementById("vistaCargando").style.display = "none";


// Si solo tiene acceso a una página, entra directo. Si tiene varias,
// se le muestra un pequeño menú para elegir.

if(paginas.length === 1){

location.href = paginas[0].href;

return;

}


if(paginas.length === 0){

document.getElementById("textoBienvenida").innerText = "👑 Sesión de Dueño";

document.getElementById("accesosMenu").innerHTML =

"<p style='text-align:center;color:#888;'>Aún no tienes ningún acceso habilitado. Pide al administrador que te dé permisos.</p>";

document.getElementById("vistaMenu").style.display = "block";

return;

}


let html = "";

paginas.forEach(function(p){

html += botonAcceso(p.id, p.icono, p.titulo, p.texto, p.href);

});


document.getElementById("accesosMenu").innerHTML = html;

document.getElementById("vistaMenu").style.display = "block";


}




function botonAcceso(clase, icono, titulo, texto, href){

return `

<button class="acceso-btn ${clase}" onclick="location.href='${href}'">

<div class="acceso-icono">${icono}</div>

<div class="acceso-texto">
<strong>${titulo}</strong>
<span>${texto}</span>
</div>

</button>

`;

}




// ===============================
// CERRAR SESION
// ===============================


function cerrarSesionIndex(){

sessionStorage.removeItem("dmrRol");

sessionStorage.removeItem("dmrPermisosDueno");

sessionStorage.removeItem("dmrRPId");

sessionStorage.removeItem("dmrRPNombre");

mostrarVistaLogin();

}


</script>
